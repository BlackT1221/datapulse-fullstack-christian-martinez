# Blueprint de Render: API Django (Docker) + PostgreSQL gratuitos.
# Render → New → Blueprint → selecciona este repositorio. Las variables marcadas `sync: false`
# se piden en el panel durante la creación (no se guardan en Git).
databases:
  - name: datapulse-db
    plan: free
    region: oregon
    databaseName: datapulse
    user: datapulse

services:
  - type: web
    name: datapulse-backend
    runtime: docker
    plan: free
    region: oregon            # misma región que la BD para usar la conexión interna
    branch: main
    autoDeploy: true
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datapulse-db
          property: connectionString
      - key: DATABASE_SSLMODE
        value: prefer
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SEED_ON_START
        value: "true"
      # URL pública HTTPS del frontend (Vercel/Netlify), sin barra final. Varias separadas por comas.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_ACCESS_MINUTES
        value: "60"
      - key: JWT_REFRESH_DAYS
        value: "1"
      # Plan free: 512 MB de RAM; 2 workers dejan margen para matplotlib (export PDF).
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
