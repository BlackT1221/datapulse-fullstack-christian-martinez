name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · flake8 + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Sin DATABASE_URL, config.settings.dev usa SQLite; la SECRET_KEY se genera efímera.
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8

      - name: Migraciones pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (pytest)
        run: pytest

  frontend:
    name: Frontend · ng test + ng build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios (Karma + ChromeHeadless)
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build de producción (ng build)
        run: npm run build
